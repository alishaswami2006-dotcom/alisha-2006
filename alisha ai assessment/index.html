    // --- MAIN REACT APPLICATION COMPONENT ---
    function App() {
      const [currency, setCurrency] = useState("USD");
      const [cart, setCart] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isWishlistOpen, setIsWishlistOpen] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isQuizOpen, setIsQuizOpen] = useState(false);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [orderSuccess, setOrderSuccess] = useState(null);
      const [activeCategory, setActiveCategory] = useState("All");
      const [searchQuery, setSearchQuery] = useState("");
      const [sortBy, setSortBy] = useState("featured");
      const [toast, setToast] = useState(null);
      const [promoCode, setPromoCode] = useState("");
      const [appliedDiscount, setAppliedDiscount] = useState(0);

      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3000);
      };

      const formatPrice = (amount) => {
        const { symbol, rate } = CURRENCIES[currency];
        const converted = (amount * rate).toFixed(amount * rate % 1 === 0 ? 0 : 2);
        return `${symbol}${converted}`;
      };

      const addToCart = (product, quantity = 1, shade = null) => {
        setCart(prev => {
          const itemKey = `${product.id}-${shade?.name || 'default'}`;
          const existing = prev.find(item => item.key === itemKey);
          if (existing) {
            return prev.map(item =>
              item.key === itemKey ? { ...item, quantity: item.quantity + quantity } : item
            );
          }
          return [...prev, { ...product, key: itemKey, selectedShade: shade, quantity }];
        });
        showToast(`✨ Added "${product.name}" to your bag`);
      };

      const updateCartQty = (key, delta) => {
        setCart(prev => prev.map(item => {
          if (item.key === key) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const removeFromCart = (key) => {
        setCart(prev => prev.filter(item => item.key !== key));
        showToast("Item removed from your bag");
      };

      const toggleWishlist = (product) => {
        if (wishlist.some(p => p.id === product.id)) {
          setWishlist(prev => prev.filter(p => p.id !== product.id));
          showToast(`Removed from your Wishlist`);
        } else {
          setWishlist(prev => [...prev, product]);
          showToast(`💖 Saved to your Wishlist`);
        }
      };

      const subtotal = useMemo(() => {
        return cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      }, [cart]);

      const discountAmount = subtotal * appliedDiscount;
      const freeShippingThreshold = 50.0;
      const shippingFee = subtotal >= freeShippingThreshold || subtotal === 0 ? 0 : 8.5;
      const finalTotal = Math.max(0, subtotal - discountAmount + shippingFee);

      const triggerConfetti = () => {
        if (window.confetti) {
          window.confetti({
            particleCount: 80,

                </div>
              </div>

              <div className="pt-8 border-t border-stone-800 flex flex-col sm:flex-row items-center justify-between gap-4 text-[11px] text-stone-500">
                <p>© 2026 LUMÉA PARIS. All Rights Reserved. Clean & Cruelty-Free certified.</p>
                <div className="flex space-x-6">
                  <span>Privacy Policy</span>
                  <span>Terms of Service</span>
                </div>
              </div>
            </div>
          </footer>

          {/* ================= MODALS ================= */}

          {/* SHOPPING BAG DRAWER */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div>
              <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
                <div className="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                  
                  <div className="p-6 border-b border-stone-200 flex items-center justify-between bg-stone-50">
                    <div className="flex items-center gap-2">
                      <Icon name="shopping-bag" className="w-5 h-5 text-gold-600" />
                      <h3 className="font-serif text-lg font-bold text-stone-900">Your Shopping Bag</h3>
                      <span className="text-xs bg-gold-100 text-gold-800 font-bold px-2 py-0.5 rounded-full">
                        {cart.reduce((t, i) => t + i.quantity, 0)}
                      </span>
                    </div>
                    <button onClick={() => setIsCartOpen(false)} className="text-stone-400 hover:text-stone-700">
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </div>

                  {/* Free shipping bar */}
                  <div className="px-6 py-3 bg-amber-50/70 border-b border-amber-100 text-xs text-amber-900">
                    {subtotal >= freeShippingThreshold ? (
                      <div className="flex items-center gap-1.5 font-semibold text-emerald-700">
                        <Icon name="check-circle" className="w-4 h-4 text-emerald-600" />
                        <span>Unlocked complimentary Express Shipping!</span>
                      </div>
                    ) : (
                      <div>
                        <span>Add <strong>{formatPrice(freeShippingThreshold - subtotal)}</strong> more for <strong>FREE Shipping</strong>!</span>
                        <div className="w-full bg-amber-200/60 h-1.5 rounded-full mt-1.5 overflow-hidden">
                          <div
                            className="bg-gold-500 h-full rounded-full transition-all"
                            style={{ width: `${Math.min(100, (subtotal / freeShippingThreshold) * 100)}%` }}
                          ></div>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Items */}
                  <div className="flex-1 overflow-y-auto p-6 space-y-4">
                    {cart.length === 0 ? (
                      <div className="text-center py-16 text-stone-400 space-y-3">
                        <Icon name="shopping-bag" className="w-12 h-12 mx-auto text-stone-300" />
                        <p className="text-sm font-medium text-stone-600">Your shopping bag is empty.</p>
                      </div>
                    ) : (
                      cart.map(item => (
                        <div key={item.key} className="flex gap-4 p-3 bg-stone-50 rounded-xl border border-stone-200">
                          <img src={item.image} alt={item.name} className="w-16 h-20 object-cover rounded-lg border" />
                          <div className="flex-1 flex flex-col justify-between">
                            <div>
                              <div className="flex justify-between items-start">
                                <h4 className="font-serif text-sm font-bold text-stone-900 line-clamp-1">{item.name}</h4>
                                <button onClick={() => removeFromCart(item.key)} className="text-stone-400 hover:text-rose-600">
                                  <Icon name="trash" className="w-3.5 h-3.5" />
                                </button>
                              </div>
                              {item.selectedShade && (
                                <div className="text-[11px] text-stone-500 flex items-center gap-1 mt-0.5">
                                  <span className="w-2 h-2 rounded-full" style={{ backgroundColor: item.selectedShade.hex }}></span>
                                  <span>{item.selectedShade.name}</span>
                                </div>
                              )}
                              <div className="text-xs font-semibold text-stone-800 mt-1">{formatPrice(item.price)}</div>
                            </div>

                            <div className="flex items-center gap-2">
                              <div className="flex items-center border border-stone-300 rounded-lg bg-white">
                                <button onClick={() => updateCartQty(item.key, -1)} className="px-2 py-1 text-xs">-</button>
                                <span className="px-2 text-xs font-bold">{item.quantity}</span>
                                <button onClick={() => updateCartQty(item.key, 1)} className="px-2 py-1 text-xs">+</button>
                              </div>
                              <span className="text-xs font-bold text-stone-900 ml-auto">{formatPrice(item.price * item.quantity)}</span>
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  {/* Footer */}
                  {cart.length > 0 && (
                    <div className="p-6 border-t border-stone-200 bg-stone-50 space-y-4">
                      <div className="flex gap-2">
                        <input
                          type="text"
                          placeholder="Promo code (GLOW20)"
                          value={promoCode}
                          onChange={(e) => setPromoCode(e.target.value)}
                          className="flex-grow px-3 py-2 text-xs bg-white border border-stone-300 rounded-lg uppercase font-semibold"
                        />
                        <button
                          onClick={() => handleApplyPromo(promoCode)}
                          className="bg-stone-800 hover:bg-stone-900 text-white px-4 py-2 text-xs font-bold rounded-lg uppercase"
                        >
                          Apply
                        </button>
                      </div>

                      <div className="space-y-1.5 text-xs text-stone-600">
                        <div className="flex justify-between">
                          <span>Subtotal</span>
                          <span className="font-semibold text-stone-900">{formatPrice(subtotal)}</span>
                        </div>
                        {appliedDiscount > 0 && (
                          <div className="flex justify-between text-rose-600 font-semibold">
                            <span>Discount ({(appliedDiscount * 100).toFixed(0)}% OFF)</span>
                            <span>-{formatPrice(discountAmount)}</span>
                          </div>
                        )}
                        <div className="flex justify-between">
                          <span>Shipping</span>
                          <span>{shippingFee === 0 ? <strong className="text-emerald-600 uppercase">FREE</strong> : formatPrice(shippingFee)}</span>
                        </div>
                        <div className="flex justify-between text-sm font-bold text-stone-900 pt-2 border-t">
                          <span>Total</span>
                          <span className="text-base text-gold-700">{formatPrice(finalTotal)}</span>
                        </div>
                      </div>

                      <button
                        onClick={() => { setIsCartOpen(false); setIsCheckoutOpen(true); }}
                        className="w-full bg-[#121110] hover:bg-black text-white py-3.5 rounded-full text-xs font-bold tracking-widest uppercase transition flex items-center justify-center gap-2 shadow-lg"
                      >
                        <Icon name="lock" className="w-4 h-4 text-gold-400" />
                        <span>Secure Checkout • {formatPrice(finalTotal)}</span>
                      </button>
                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

          {/* QUICK VIEW MODAL */}
          {selectedProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="fixed inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setSelectedProduct(null)}></div>
              <div className="relative bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl z-10 border border-stone-200">
                <button onClick={() => setSelectedProduct(null)} className="absolute top-4 right-4 p-2 text-stone-400 hover:text-stone-800">
                  <Icon name="x" className="w-5 h-5" />
                </button>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                  <div className="rounded-2xl overflow-hidden aspect-square border">
                    <img src={selectedProduct.image} alt={selectedProduct.name} className="w-full h-full object-cover" />
                  </div>
                  <div className="space-y-4">
                    <div>
                      <span className="text-[10px] font-bold text-gold-600 uppercase tracking-widest">{selectedProduct.category} • {selectedProduct.volume}</span>
                      <h3 className="font-serif text-2xl font-bold text-stone-900 mt-1">{selectedProduct.name}</h3>
                      <div className="flex items-center gap-2 mt-1">
                        <div className="flex text-amber-400">
                          {[...Array(5)].map((_, i) => (
                            <Icon key={i} name="star" className="w-3.5 h-3.5 text-amber-400" fill="#FBBF24" />
                          ))}
                        </div>
                        <span className="text-xs text-stone-500">{selectedProduct.rating} ({selectedProduct.reviewsCount} reviews)</span>
                      </div>
                    </div>

                    <div className="text-2xl font-bold text-stone-900">{formatPrice(selectedProduct.price)}</div>
                    <p className="text-stone-600 text-xs leading-relaxed">{selectedProduct.description}</p>

                    <button
                      onClick={() => {
                        addToCart(selectedProduct, 1, selectedProduct.shades ? selectedProduct.shades[0] : null);
                        setSelectedProduct(null);
                      }}
                      className="w-full bg-[#121110] hover:bg-gold-600 text-white py-3.5 rounded-full text-xs font-bold tracking-widest uppercase transition flex items-center justify-center gap-2"
                    >
                      <Icon name="shopping-bag" className="w-4 h-4 text-gold-400" />
                      <span>Add To Bag</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* QUIZ MODAL */}
          {isQuizOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="fixed inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setIsQuizOpen(false)}></div>
              <div className="relative bg-white rounded-3xl max-w-lg w-full p-8 shadow-2xl z-10 border border-stone-200">
                <button onClick={() => setIsQuizOpen(false)} className="absolute top-4 right-4 text-stone-400">
                  <Icon name="x" className="w-5 h-5" />
                </button>
                <div className="text-center space-y-2 mb-6">
                  <div className="inline-flex p-2.5 rounded-full bg-gold-100 text-gold-700">
                    <Icon name="sparkles" className="w-6 h-6 text-gold-600" />
                  </div>
                  <h3 className="font-serif text-2xl font-bold text-stone-900">Personalized Skin Diagnostic</h3>
                  <p className="text-stone-500 text-xs">Unlock your custom Parisian formulation routine.</p>
                </div>

                <div className="space-y-4">
                  <button
                    onClick={() => {
                      setIsQuizOpen(false);
                      addToCart(RAW_PRODUCTS[0], 1);
                      addToCart(RAW_PRODUCTS[2], 1);
                      showToast("🌟 Routine generated! Use code GLOW20 for 20% off");
                      setIsCartOpen(true);
                      triggerConfetti();
                    }}
                    className="w-full bg-[#121110] hover:bg-gold-600 text-white py-3.5 rounded-full text-xs font-bold tracking-widest uppercase transition mt-4"
                  >
                    Select Routine & Get 20% OFF
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CHECKOUT MODAL */}
          {isCheckoutOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="fixed inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setIsCheckoutOpen(false)}></div>
              <div className="relative bg-white rounded-3xl max-w-lg w-full p-8 shadow-2xl z-10 border border-stone-200">
                <button onClick={() => setIsCheckoutOpen(false)} className="absolute top-4 right-4 text-stone-400">
                  <Icon name="x" className="w-5 h-5" />
                </button>
                <div className="mb-6">
                  <span className="text-[10px] font-bold text-gold-600 uppercase tracking-widest">SSL Encrypted Checkout</span>
                  <h3 className="font-serif text-2xl font-bold text-stone-900">Complete Your Order</h3>
                  <div className="text-xs text-stone-500 mt-1">Total: <strong className="text-stone-900">{formatPrice(finalTotal)}</strong></div>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    setIsCheckoutOpen(false);
                    setCart([]);
                    setOrderSuccess({ id: "LUM-" + Math.floor(100000 + Math.random() * 900000), total: formatPrice(finalTotal) });
                    triggerConfetti();
                  }}
                  className="space-y-4 text-xs"
                >
                  <input type="text" required placeholder="Full Name" className="w-full p-2.5 bg-stone-50 border rounded-lg" />
                  <input type="text" required placeholder="Shipping Address" className="w-full p-2.5 bg-stone-50 border rounded-lg" />
                  <input type="text" required placeholder="Card Number (4000 1234 5678 9010)" className="w-full p-2.5 bg-stone-50 border rounded-lg" />
                  <button type="submit" className="w-full bg-[#121110] hover:bg-gold-600 text-white py-3.5 rounded-full text-xs font-bold tracking-widest uppercase transition shadow-lg">
                    Place Order • {formatPrice(finalTotal)}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ORDER SUCCESS MODAL */}
          {orderSuccess && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="fixed inset-0 bg-black/70 backdrop-blur-md"></div>
              <div className="relative bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl z-10 text-center space-y-4 border border-gold-300">
                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto">
                  <Icon name="check" className="w-8 h-8 text-emerald-600" />
                </div>
                <h3 className="font-serif text-2xl font-bold text-stone-900">Merci for Choosing Luméa!</h3>
                <p className="text-xs text-stone-600">Your order reference is <strong className="text-stone-900 font-mono">{orderSuccess.id}</strong>.</p>
                <div className="bg-stone-50 p-3 rounded-xl text-xs text-stone-700">Total Paid: <strong>{orderSuccess.total}</strong></div>
                <button onClick={() => setOrderSuccess(null)} className="w-full bg-[#121110] text-white py-3 rounded-full text-xs font-bold tracking-widest uppercase">
                  Continue Shopping
                </button>
              </div>
            </div>
          )}

          {/* WISHLIST DRAWER */}
          {isWishlistOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setIsWishlistOpen(false)}></div>
              <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
                <div className="w-screen max-w-md bg-white shadow-2xl flex flex-col p-6">
                  <div className="flex items-center justify-between pb-4 border-b">
                    <div className="flex items-center gap-2">
                      <Icon name="heart" className="w-5 h-5 text-rose-500 fill-rose-500" />
                      <h3 className="font-serif text-lg font-bold text-stone-900">Your Wishlist</h3>
                    </div>
                    <button onClick={() => setIsWishlistOpen(false)} className="text-stone-400">
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="flex-1 overflow-y-auto py-4 space-y-4">
                    {wishlist.length === 0 ? (
                      <div className="text-center py-16 text-stone-400">No items saved yet.</div>
                    ) : (
                      wishlist.map(item => (
                        <div key={item.id} className="flex gap-3 p-3 bg-stone-50 rounded-xl border items-center">
                          <img src={item.image} alt={item.name} className="w-16 h-16 object-cover rounded-lg" />
                          <div className="flex-1">
                            <h4 className="font-serif text-xs font-bold line-clamp-1">{item.name}</h4>
                            <div className="text-xs text-gold-700 font-bold">{formatPrice(item.price)}</div>
                          </div>
                          <button
                            onClick={() => { addToCart(item, 1); toggleWishlist(item); }}
                            className="bg-[#121110] text-white px-3 py-1.5 rounded-lg text-xs"
                          >
                            Move to Bag
                          </button>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
